
name: Build Movie Catalog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate movie catalog
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python build-catalog.py

      - name: Save generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movie-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Update automatic movie catalog"
            git push
          fi
